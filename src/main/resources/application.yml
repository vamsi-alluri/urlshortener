server:
  # Behind the HTTPS proxy (the Cloudflare tunnel today, Caddy in ticket #9) the app sees a
  # plain HTTP connection. Honour X-Forwarded-Proto/Host so URLs the app builds from the
  # request — the OAuth redirect_uri above all — come out as the public HTTPS URL (#16).
  forward-headers-strategy: framework

spring:
  application:
    name: urlshortener
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${URLSHORTENER_DB_URL:jdbc:sqlite:./data/urlshortener.db}
    # ADR-0005: SQLite runs in WAL mode. A PRAGMA inside a Flyway migration would
    # fail (migrations run in a transaction, where journal_mode cannot change),
    # so WAL is enabled on every pooled connection instead.
    hikari:
      connection-init-sql: PRAGMA journal_mode=WAL
  session:
    jdbc:
      # SQLite is not detected as an embedded database, and Boot's session schema
      # initializer runs with continueOnError, so `always` is restart-safe.
      # Also creates the SPRING_SESSION tables, without which every
      # session-writing request 500s (observed on the running instance).
      initialize-schema: always

app:
  base-url: ${URLSHORTENER_BASE_URL:http://localhost:8080}
  # The per-key creation throttle (issue #7, D15): a config value, not a policy —
  # human-generous, and there is no lifetime quota anywhere. The default also lives
  # in RateLimitProperties (for contexts without this file).
  rate-limit:
    creations-per-hour: ${URLSHORTENER_RATE_LIMIT_CREATIONS_PER_HOUR:60}
